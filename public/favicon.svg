<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="face" gradientUnits="userSpaceOnUse" cx="210" cy="150" r="380">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="0.55" stop-color="#FFC23A"/>
      <stop offset="1" stop-color="#F7852A"/>
    </radialGradient>
    <radialGradient id="faceSad" gradientUnits="userSpaceOnUse" cx="210" cy="150" r="380">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset="0.55" stop-color="#FCA23A"/>
      <stop offset="1" stop-color="#F0662C"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6F61" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF6F61" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="left"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="right"><rect x="256" y="0" width="256" height="512"/></clipPath>
  </defs>

  <!-- left half: smiling -->
  <g clip-path="url(#left)">
    <circle cx="256" cy="256" r="232" fill="url(#face)"/>
    <ellipse cx="112" cy="290" rx="44" ry="28" fill="url(#blush)"/>
    <path d="M128 222 Q168 176 208 222" fill="none" stroke="#5B3A1E" stroke-width="20" stroke-linecap="round"/>
    <path d="M136 318 Q256 420 376 318" fill="none" stroke="#5B3A1E" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- right half: frowning -->
  <g clip-path="url(#right)">
    <circle cx="256" cy="256" r="232" fill="url(#faceSad)"/>
    <ellipse cx="350" cy="220" rx="26" ry="36" fill="#5B3A1E"/>
    <circle cx="358" cy="206" r="8" fill="#fff" opacity="0.85"/>
    <path d="M146 392 Q256 346 366 392" fill="none" stroke="#5B3A1E" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- split line -->
  <line x1="256" y1="24" x2="256" y2="488" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
